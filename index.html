<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      color: #1a202c;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin: 0;
      color: #718096;
      font-size: 16px;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 2px solid rgba(255,255,255,.3);
      overflow-x: auto;
      padding: 0 0 8px;
    }

    .tab-btn {
      padding: 12px 24px;
      border: none;
      background: transparent;
      color: #718096;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all .3s ease;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: #4a5568;
    }

    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-content {
      display: none;
      animation: fadeIn .3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,.07);
      border: 1px solid rgba(0,0,0,.05);
      transition: all .3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      box-shadow: 0 12px 24px rgba(0,0,0,.12);
      transform: translateY(-4px);
    }

    .card h3, .card h2 {
      margin: 0 0 12px;
      font-size: 20px;
      color: #2d3748;
    }

    .card-meta {
      font-size: 14px;
      color: #718096;
      line-height: 1.6;
      margin: 6px 0;
    }

    .members-box {
      background: #f7fafc;
      border-left: 4px solid #667eea;
      padding: 10px;
      border-radius: 6px;
      margin-top: 12px;
      font-size: 13px;
      color: #4a5568;
    }

    .members-box strong {
      display: block;
      margin-bottom: 4px;
      color: #2d3748;
    }

    .join-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .3s ease;
    }

    .join-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 16px rgba(102, 126, 234, .4);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: min(500px, 100%);
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    .modal-content h2 {
      margin: 0 0 20px;
      font-size: 28px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 6px;
      color: #2d3748;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border .2s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,.1);
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all .3s ease;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #2d3748;
    }

    .btn-secondary:hover {
      background: #cbd5e0;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(102, 126, 234, .4);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
      z-index: 200;
      box-shadow: 0 8px 16px rgba(0,0,0,.2);
    }

    .toast.show {
      opacity: 1;
    }

    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      transition: opacity 0.2s;
    }

    .link-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Class Hub</h1>
      <p class="subtitle">Твой помощник в учёбе — проекты, дедлайны и силлабус</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="projects">📦 Проекты</button>
      <button class="tab-btn" data-tab="deadlines">⏰ Дедлайны</button>
      <button class="tab-btn" data-tab="syllabus">📖 Силлабус</button>
    </div>

    <!-- ПРОЕКТЫ -->
    <div id="projects" class="tab-content active">
      <div id="projectsList" class="grid"></div>
    </div>

    <!-- ДЕДЛАЙНЫ -->
    <div id="deadlines" class="tab-content">
      <div id="deadlinesList" class="grid"></div>
    </div>

    <!-- СИЛЛАБУС -->
    <div id="syllabus" class="tab-content">
      <div id="syllabusList" class="grid"></div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО -->
  <div class="modal" id="joinModal">
    <div class="modal-content">
      <h2>Подать заявку</h2>
      <label for="studentName">Имя</label>
      <input id="studentName" type="text" placeholder="Иван Петров" />
      
      <label for="studentTelegramId">Telegram ID или @username</label>
      <input id="studentTelegramId" type="text" placeholder="123456789 или @username" />
      
      <div class="actions">
        <button class="btn btn-secondary" id="cancelBtn">Отмена</button>
        <button class="btn btn-primary" id="submitJoinBtn">Отправить</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const GAS_URL = "https://class-hub.nureldinmuhamedov010410.workers.dev/";
    let currentProjectId = null;

    const $ = (id) => document.getElementById(id);
    const escape = (str) => String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    }[c]));

    // Универсальная функция получения значения из объекта (без учета регистра ключа)
    function getVal(obj, ...keys) {
      if (!obj || typeof obj !== 'object') return '';
      for (const k of keys) {
        if (obj[k] !== undefined && obj[k] !== null && obj[k] !== '') return obj[k];
      }
      const objKeys = Object.keys(obj);
      for (const k of keys) {
        const lowerK = String(k).toLowerCase();
        const foundKey = objKeys.find(key => key.toLowerCase() === lowerK);
        if (foundKey && obj[foundKey] !== undefined && obj[foundKey] !== null && obj[foundKey] !== '') {
          return obj[foundKey];
        }
      }
      return '';
    }

    function getTelegramUrl(tg) {
      if (!tg) return null;
      const cleanTg = String(tg).trim().replace(/^@/, '');
      return cleanTg ? `https://t.me/${cleanTg}` : null;
    }

    // ===== ВКЛАДКИ =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tabName = e.target.dataset.tab;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        e.target.classList.add('active');
        $(tabName).classList.add('active');
      });
    });

    // ===== МОДАЛЬНОЕ ОКНО =====
    function openModal() { $('joinModal').classList.add('open'); }
    function closeModal() {
      $('joinModal').classList.remove('open');
      $('studentName').value = '';$('studentTelegramId').value = '';
      currentProjectId = null;
    }
    if ($('cancelBtn'))$('cancelBtn').addEventListener('click', closeModal);
    if ($('joinModal')) $('joinModal').addEventListener('click', (e) => { if (e.target ===$('joinModal')) closeModal(); });

    // ===== ОТПРАВКА ЗАЯВКИ =====
    if ($('submitJoinBtn')) {$('submitJoinBtn').addEventListener('click', async () => {
        const studentName = $('studentName').value.trim();
        const studentId = $('studentTelegramId').value.trim();
        
        if (!currentProjectId || !studentName || !studentId) {
          alert('Пожалуйста, заполните все поля.');
          return;
        }

        $('submitJoinBtn').disabled = true;
        $('submitJoinBtn').textContent = 'Отправка...';

        try {
          await fetch(GAS_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({
              action: 'joinProjectRequest',
              projectId: currentProjectId,
              studentId: studentId,
              studentName: studentName
            })
          });

          closeModal();
          showToast('✅ Заявка отправлена лидеру проекта!');
        } catch (error) {
          alert('❌ Ошибка отправки: ' + error.message);
        } finally {
          $('submitJoinBtn').disabled = false;
          $('submitJoinBtn').textContent = 'Отправить';
        }
      });
    }

    function showToast(message) {
      const toast = $('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ===== ЗАГРУЗКА ДАННЫХ =====
    async function loadAllData() {
      try {
        const response = await fetch(GAS_URL);
        if (!response.ok) throw new Error(`Ошибка HTTP: ${response.status}`);
        
        const raw = await response.json();

        let projects = raw.projects || raw.data || [];
        let deadlines = raw.deadlines || [];
        let syllabus = raw.syllabus || [];

        // Если получен массив напрямую
        if (Array.isArray(raw)) {
          projects = raw;
        }

        // Запасная подгрузка, если вкладка не пришла в едином ответе
        if (!deadlines.length) {
          try {
            const resD = await fetch(`${GAS_URL}?action=getDeadlines`);
            const dataD = await resD.json();
            deadlines = dataD.data || dataD.deadlines || [];
          } catch(e) {}
        }

        if (!syllabus.length) {
          try {
            const resS = await fetch(`${GAS_URL}?action=getSyllabus`);
            const dataS = await resS.json();
            syllabus = dataS.data || dataS.syllabus || [];
          } catch(e) {}
        }

        renderProjects(projects);
        renderDeadlines(deadlines);
        renderSyllabus(syllabus);

      } catch (error) {
        console.error("Ошибка загрузки:", error);
        $('projectsList').innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 30px; color: #742a2a; background: #fed7d7; border-radius: 8px;">
          <strong>❌ Не удалось загрузить данные:</strong> ${escape(error.message)}
        </div>`;
      }
    }

    // ===== 1. ОТРЕСОВКА ПРОЕКТОВ =====
    function renderProjects(projects) {
      const container = $('projectsList');
      if (!Array.isArray(projects) || projects.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #a0aec0;"><div style="font-size: 48px; margin-bottom: 12px;">📭</div>Активных проектов пока нет</div>';
        return;
      }

      container.innerHTML = projects.map(p => {
        const id = getVal(p, 'projectId', 'Project_ID', 'id');
        const name = getVal(p, 'projectName', 'Project_Name', 'name') || 'Без названия';
        const subject = getVal(p, 'subject', 'Subject', 'Предмет') || '—';
        const deadline = getVal(p, 'deadline', 'Deadline', 'Срок') || '—';
        const points = getVal(p, 'points', 'Points', 'Credits', 'credits');
        const maxCap = Number(getVal(p, 'maxCapacity', 'Max_Capacity')) || 0;
        const currCount = Number(getVal(p, 'currentCount', 'Current_Count')) || 1;
        const available = Math.max(0, maxCap - currCount);
        
        const leaderTg = getVal(p, 'leaderTelegramId', 'Leader_Telegram_ID');
        const tgLink = getTelegramUrl(leaderTg);
        const projectLink = getVal(p, 'link', 'Link', 'url', 'URL');

        let membersRaw = getVal(p, 'approvedMembers', 'Approved_Members', 'members');
        let membersArr = Array.isArray(membersRaw) 
          ? membersRaw 
          : String(membersRaw).split(',').map(m => m.trim()).filter(Boolean);

        const membersStr = membersArr.length ? membersArr.map(m => escape(m)).join(', ') : 'Нет участников';

        return `
          <div class="card">
            <div>
              <h3>${escape(name)}</h3>
              <div class="card-meta"><strong>📚 Предмет:</strong> ${escape(subject)}</div>
              <div class="card-meta"><strong>📅 Дедлайн:</strong> ${escape(deadline)}</div>
              ${points ? `<div class="card-meta"><strong>🏆 Баллы / Кредиты:</strong> ${escape(points)}</div>` : ''}
              <div class="card-meta"><strong>👥 Свободно мест:</strong> ${available}/${maxCap}</div>
              
              <div class="members-box">
                <strong>Участники:</strong> ${membersStr}
              </div>
            </div>

            <div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px;">
                ${tgLink ? `<a href="${tgLink}" target="_blank" class="link-btn" style="background: #209cee;">💬 Лидер в TG</a>` : ''}
                ${projectLink ? `<a href="${escape(projectLink)}" target="_blank" class="link-btn" style="background: #48bb78;">📁 ТЗ / Файлы</a>` : ''}
              </div>

              <button class="join-btn" onclick="currentProjectId='${escape(id)}'; openModal();">Подать заявку</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ===== 2. ОТРЕСОВКА ДЕДЛАЙНОВ =====
    function renderDeadlines(deadlines) {
      const container = $('deadlinesList');
      if (!Array.isArray(deadlines) || deadlines.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #a0aec0;"><div style="font-size: 48px; margin-bottom: 12px;">✨</div>Дедлайнов не найдено</div>';
        return;
      }

      container.innerHTML = deadlines.map(d => {
        const subject = getVal(d, 'Subject', 'subject', 'Предмет') || 'Без предмета';
        const task = getVal(d, 'Task', 'Task_Description', 'task', 'task_description', 'Задание') || '—';
        const date = getVal(d, 'Date', 'Deadline_Date', 'date', 'deadline_date', 'Срок', 'Дедлайн') || '—';
        const link = getVal(d, 'Link', 'link', 'URL', 'url', 'Ссылка');
        const points = getVal(d, 'Points', 'points', 'Credits', 'credits', 'Баллы');

        return `
          <div class="card">
            <div>
              <h3>${escape(subject)}</h3>
              <div class="card-meta"><strong>Задание:</strong> ${escape(task)}</div>
              <div class="card-meta"><strong>📅 Срок:</strong> ${escape(date)}</div>
              ${points ? `<div class="card-meta"><strong>🏆 Баллы / Кредиты:</strong> ${escape(points)}</div>` : ''}
            </div>

            ${link ? `
              <div style="margin-top: 16px;">
                <a href="${escape(link)}" target="_blank" class="link-btn" style="background: #667eea; width: 100%; justify-content: center;">
                  🔗 Открыть задание
                </a>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    // ===== 3. ОТРЕСОВКА СИЛЛАБУСА =====
    function renderSyllabus(syllabus) {
      const container = $('syllabusList');
      if (!Array.isArray(syllabus) || syllabus.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #a0aec0;"><div style="font-size: 48px; margin-bottom: 12px;">📚</div>Силлабус пока не заполнен</div>';
        return;
      }

      container.innerHTML = syllabus.map(s => {
        const subject = getVal(s, 'Subject', 'subject', 'Предмет') || 'Без названия';
        const title = getVal(s, 'Title', 'title', 'Topic', 'topic', 'Тема') || 'Силлабус';
        const instructor = getVal(s, 'Instructor', 'instructor', 'Преподаватель');
        const link = getVal(s, 'Link', 'link', 'URL', 'url', 'Ссылка');

        return `
          <div class="card">
            <div>
              <h3>${escape(subject)}</h3>
              <div class="card-meta"><strong>Описание:</strong> ${escape(title)}</div>
              ${instructor ? `<div class="card-meta"><strong>👤 Преподаватель:</strong> ${escape(instructor)}</div>` : ''}
            </div>

            <div style="margin-top: 16px;">
              ${link 
                ? `<a href="${escape(link)}" target="_blank" class="link-btn" style="background: #ED8936; width: 100%; justify-content: center;">📖 Открыть силлабус</a>`
                : `<span style="font-size: 13px; color: #a0aec0;">Ссылка временно отсутствует</span>`
              }
            </div>
          </div>
        `;
      }).join('');
    }

    loadAllData();
  </script>
</body>
</html>
