<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1120" />
  <title>Class Hub — учебный центр</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: { base: '#0B1120', panel: '#111A2E' },
          keyframes: {
            pulseDot: {
              '0%, 100%': { boxShadow: '0 0 0 0 rgba(52, 211, 153, 0.55)' },
              '70%': { boxShadow: '0 0 0 6px rgba(52, 211, 153, 0)' },
            },
            shimmer: {
              '0%': { backgroundPosition: '100% 0' },
              '100%': { backgroundPosition: '0 0' },
            },
          },
          animation: {
            pulseDot: 'pulseDot 2s infinite',
            shimmer: 'shimmer 1.6s ease infinite',
          },
        },
      },
    };
  </script>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #0B1120; }
    body { font-family: 'Inter', system-ui, sans-serif; }

    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .glass-strong {
      background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.10);
    }

    ::-webkit-scrollbar { display: none; }
    * { scrollbar-width: none; }

    .skel {
      background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.10) 37%, rgba(255,255,255,0.05) 63%);
      background-size: 400% 100%;
    }

    .tab-underline { position: relative; }
    .tab-underline.active::after {
      content: '';
      position: absolute;
      left: 14px; right: 14px; bottom: -1px;
      height: 2px; border-radius: 2px;
      background: linear-gradient(90deg, #60A5FA, #34D399);
    }

    .deadline-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .badge-subject, .badge-type {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-subject {
      background-color: #e3f2fd;
      color: #1565c0;
    }

    .badge-type {
      background-color: #f3e5f5;
      color: #6a1b9a;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid #f0f0f0;
    }

    .task-link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background-color: #0088cc;
      color: #ffffff !important;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .task-link-btn:hover {
      background-color: #006699;
    }

    .sort-btn {
      transition: all 0.2s ease;
    }
    .sort-btn.active {
      background-color: rgba(96, 165, 250, 0.2);
      color: #60A5FA;
      border-color: rgba(96, 165, 250, 0.4);
    }

    button, a { -webkit-tap-highlight-color: transparent; }
    input:focus-visible, button:focus-visible, a:focus-visible {
      outline: 2px solid #60A5FA;
      outline-offset: 2px;
    }

    .fade-in { animation: fadeIn 0.25s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

    .view.hidden { display: none; }
    .view { display: block; }

    @media (prefers-reduced-motion: reduce) {
      .animate-pulseDot, .animate-shimmer, .fade-in { animation: none !important; }
    }

    @media (prefers-color-scheme: light) {
      html, body { background: #f6f8fa; color: #0b1120; }
      .glass { background: linear-gradient(180deg, rgba(11,17,32,0.05), rgba(11,17,32,0.02)); border-color: rgba(11,17,32,0.08); }
      .glass-strong { background: linear-gradient(180deg, rgba(11,17,32,0.08), rgba(11,17,32,0.04)); border-color: rgba(11,17,32,0.08); }
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

<header class="sticky top-0 z-20 px-4 pt-4 pb-3" style="padding-top: calc(env(safe-area-inset-top, 0px) + 16px); background: linear-gradient(180deg, #0B1120 70%, rgba(11,17,32,0.85) 100%);">
  <div class="flex items-center gap-3">
    <div class="relative shrink-0">
      <div id="avatar" class="h-11 w-11 rounded-2xl glass-strong flex items-center justify-center text-sm font-bold text-slate-100">CH</div>
      <span class="absolute -bottom-0.5 -right-0.5 h-3 w-3 rounded-full bg-emerald-400 ring-2 ring-[#0B1120] animate-pulseDot" aria-hidden="true"></span>
    </div>
    <div class="min-w-0">
      <h1 class="text-[17px] font-bold leading-tight tracking-tight">Class Hub</h1>
      <p id="greeting" class="text-[12.5px] text-slate-400 truncate">Твой центр учебных данных</p>
    </div>
  </div>
</header>

<nav class="sticky top-[68px] z-20 px-4 pb-2" style="background: #0B1120;" role="tablist">
  <div class="flex gap-1 border-b border-white/10">
    <button id="tab-deadlines" data-view="deadlines" aria-controls="view-deadlines" class="tab-btn tab-underline active flex-1 py-2.5 text-[13px] font-semibold text-slate-100" role="tab" aria-selected="true">📋 Дедлайны</button>
    <button id="tab-groups" data-view="groups" aria-controls="view-groups" class="tab-btn tab-underline flex-1 py-2.5 text-[13px] font-semibold text-slate-400" role="tab" aria-selected="false">👥 Проекты</button>
    <button id="tab-syllabus" data-view="syllabus" aria-controls="view-syllabus" class="tab-btn tab-underline flex-1 py-2.5 text-[13px] font-semibold text-slate-400" role="tab" aria-selected="false">📚 Курсы</button>
  </div>
</nav>

<main class="flex-1 px-4 pt-3 pb-8 overflow-y-auto">
  <div id="error-slot" role="alert"></div>

  <!-- View: Deadlines -->
  <section id="view-deadlines" class="view fade-in" role="tabpanel" aria-labelledby="tab-deadlines">
    <div class="mb-3">
      <div class="text-[11px] uppercase tracking-wider text-slate-400 mb-1.5 font-semibold">Сортировка:</div>
      <div class="flex gap-2 overflow-x-auto pb-1">
        <button id="sort-date" data-sort="date" class="sort-btn active px-3 py-1.5 rounded-xl text-[12px] font-medium glass border border-white/10 shrink-0">📅 Ближайшие</button>
        <button id="sort-credits" data-sort="credits" class="sort-btn px-3 py-1.5 rounded-xl text-[12px] font-medium glass border border-white/10 text-slate-400 shrink-0">🎓 По кредитам</button>
        <button id="sort-points" data-sort="points" class="sort-btn px-3 py-1.5 rounded-xl text-[12px] font-medium glass border border-white/10 text-slate-400 shrink-0">⭐ По баллам</button>
      </div>
    </div>
    <div id="deadlines-list" class="space-y-2.5"></div>
  </section>

  <!-- View: Groups -->
  <section id="view-groups" class="view hidden" role="tabpanel" aria-labelledby="tab-groups">
    <div class="relative mb-3">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <label for="group-search" class="sr-only">Поиск проекта</label>
      <input id="group-search" type="search" placeholder="Поиск по предмету или теме…"
        class="w-full glass rounded-xl pl-9 pr-3 py-2.5 text-[13.5px] text-slate-100 placeholder:text-slate-500 outline-none" />
    </div>
    <div id="groups-list" class="space-y-2.5"></div>
  </section>

  <!-- View: Syllabus -->
  <section id="view-syllabus" class="view hidden" role="tabpanel" aria-labelledby="tab-syllabus">
    <div id="syllabus-list" class="space-y-2.5"></div>
  </section>
</main>

<script>
(function () {
  const API_URL = 'https://script.google.com/macros/s/AKfycbxwvJdHq7pDG6YGRs8Z_2yyeyCOUW7RLJEyevZEWE-KE-TDZCI3mU5tdqMGPQUR7ucR/exec';

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) { try { tg.setHeaderColor('#0B1120'); } catch (e) {} }
    if (tg.setBackgroundColor) { try { tg.setBackgroundColor('#0B1120'); } catch (e) {} }
  }

  const currentUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;

  function haptic(style) {
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch (e) {}
    }
  }

  // Personalization
  (function personalize() {
    const firstName = currentUser && currentUser.first_name;
    if (firstName) {
      document.getElementById('greeting').textContent = 'Привет, ' + firstName + ' 👋';
      const initials = (firstName[0] || 'C') + ((currentUser.last_name || '')[0] || '');
      document.getElementById('avatar').textContent = initials.toUpperCase();
    }
  })();

  // Tab Management
  const tabButtons = document.querySelectorAll('.tab-btn');
  const views = {
    deadlines: document.getElementById('view-deadlines'),
    groups: document.getElementById('view-groups'),
    syllabus: document.getElementById('view-syllabus')
  };

  function switchTab(viewName) {
    haptic('light');
    tabButtons.forEach(function (b) {
      b.classList.remove('active', 'text-slate-100');
      b.classList.add('text-slate-400');
      b.setAttribute('aria-selected', 'false');
    });
    Object.keys(views).forEach(function (k) {
      views[k].classList.add('hidden');
    });

    const activeBtn = document.getElementById('tab-' + viewName);
    if (activeBtn) {
      activeBtn.classList.add('active', 'text-slate-100');
      activeBtn.classList.remove('text-slate-400');
      activeBtn.setAttribute('aria-selected', 'true');
    }

    const activeView = views[viewName];
    if (activeView) {
      activeView.classList.remove('hidden');
      activeView.classList.remove('fade-in');
      void activeView.offsetWidth;
      activeView.classList.add('fade-in');
    }

    if (viewName === 'groups') {
      loadProjects();
    }
  }

  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      switchTab(btn.dataset.view);
    });
  });

  if (tg && tg.MainButton) {
    tg.MainButton.setText('Обновить данные');
    tg.MainButton.onClick(function () { haptic('medium'); loadAll(); loadProjects(); });
    tg.MainButton.show();
  }

  // Utility Functions
  function skeletonCard() {
    return '<div class="glass rounded-2xl p-4">' +
      '<div class="skel h-3 w-2/5 rounded mb-3 animate-shimmer"></div>' +
      '<div class="skel h-2.5 w-3/5 rounded mb-2 animate-shimmer"></div>' +
      '<div class="skel h-2.5 w-4/5 rounded animate-shimmer"></div>' +
    '</div>';
  }

  function showSkeletons() {
    ['deadlines-list', 'groups-list', 'syllabus-list'].forEach(function (id) {
      document.getElementById(id).innerHTML = skeletonCard() + skeletonCard() + skeletonCard();
    });
  }
  showSkeletons();

  let state = { schedule: [], groups: [], projects: [], syllabus: [] };
  let currentSort = 'date';
  let hasLoadedData = false;
  let requestInFlight = false;

  // Sort Buttons
  const sortBtns = document.querySelectorAll('.sort-btn');
  sortBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      haptic('light');
      sortBtns.forEach(function (b) {
        b.classList.remove('active', 'text-slate-100');
        b.classList.add('text-slate-400');
      });
      btn.classList.add('active', 'text-slate-100');
      btn.classList.remove('text-slate-400');
      currentSort = btn.dataset.sort;
      renderDeadlines();
    });
  });

  function loadAll() {
    if (requestInFlight) return;
    requestInFlight = true;
    document.getElementById('error-slot').innerHTML = '';
    if (tg && tg.MainButton) tg.MainButton.showProgress();

    fetch(API_URL + '?action=getAll')
      .then(function (res) {
        if (!res.ok) throw new Error('Ошибка сети: ' + res.status);
        return res.json();
      })
      .then(function (json) {
        if (!json.ok) throw new Error(json.error || 'Неизвестная ошибка API');
        if (!json.data || typeof json.data !== 'object') throw new Error('API вернуло данные в неверном формате');
        state.schedule = Array.isArray(json.data.schedule) ? json.data.schedule : [];
        state.groups = Array.isArray(json.data.groups) ? json.data.groups : [];
        state.syllabus = Array.isArray(json.data.syllabus) ? json.data.syllabus : [];
        renderDeadlines();
        renderSyllabus();
        hasLoadedData = true;
      })
      .catch(function (err) {
        document.getElementById('error-slot').innerHTML =
          '<div class="glass rounded-xl p-3 mb-3 text-[13px] text-rose-300" style="border-color: rgba(251,113,133,0.25);">Не удалось загрузить данные: ' + escapeHTML(err.message) + '</div>';
        if (!hasLoadedData) {
          ['deadlines-list', 'groups-list', 'syllabus-list'].forEach(function (id) {
            document.getElementById(id).innerHTML = emptyState('Нет данных.');
          });
        }
      })
      .finally(function () {
        requestInFlight = false;
        if (tg && tg.MainButton) tg.MainButton.hideProgress();
      });
  }

  async function loadProjects() {
  const container = document.getElementById('projects-container');
  if (!container) return;

  container.innerHTML = '<div class="loading">Загрузка проектов...</div>';

  try {
    // Устанавливаем таймаут запроса, чтобы сайт не вис бесконечно
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000); // 10 секунд max

    const response = await fetch(`${API_URL}?action=getProjects`, { signal: controller.signal });
    clearTimeout(timeoutId);

    const result = await response.json();

    if (!result.ok || !result.data || !result.data.projects) {
      container.innerHTML = '<div class="error">⚠️ Не удалось получить список проектов. Проверьте вкладку Projects в Google Таблице.</div>';
      return;
    }

    renderProjects(result.data.projects);

  } catch (err) {
    console.error('Projects load error:', err);
    if (err.name === 'AbortError') {
      container.innerHTML = '<div class="error">⏱️ Сервер отвечает слишком долго. Попробуйте обновить страницу.</div>';
    } else {
      container.innerHTML = '<div class="error">❌ Ошибка сети при загрузке проектов.</div>';
    }
  }
}

function renderProjects(projects) {
  const container = document.getElementById('projects-container');
  if (!container) return;

  if (!projects || projects.length === 0) {
    container.innerHTML = '<div class="empty">Список проектов пуст 🎉</div>';
    return;
  }

  // Фильтруем просроченные проекты (устойчиво к регистру символов)
  const activeProjects = projects.filter(p => {
    const status = String(p.Status || p.status || '').toLowerCase();
    return status !== 'expired' && status !== 'archived';
  });

  if (activeProjects.length === 0) {
    container.innerHTML = '<div class="empty">Активных проектов пока нет.</div>';
    return;
  }

  container.innerHTML = activeProjects.map(item => {
    // Безопасное считывание полей (с фоллбэками на случай разного регистра в Google Таблице)
    const name = item.Project_Name || item.project_name || item.Name || 'Без названия';
    const subject = item.Subject || item.subject || 'Предмет не указан';
    const maxCap = Number(item.Max_Capacity || item.max_capacity || 0);
    const curCount = Number(item.Current_Count || item.current_count || 0);
    const membersRaw = item.Members || item.members || '';
    const members = membersRaw ? String(membersRaw).split(',').join(', ') : 'Участников пока нет';
    const deadline = item.Deadline || item.deadline || 'Без дедлайна';

    const isFull = curCount >= maxCap && maxCap > 0;

    return `
      <div class="project-card ${isFull ? 'full-card' : ''}">
        <div class="card-header">
          <span class="badge-subject">${escapeHtml(subject)}</span>
          <span class="badge-capacity ${isFull ? 'full-badge' : ''}">
            👥 ${curCount} / ${maxCap} мест
          </span>
        </div>
        
        <h3 class="project-title">${escapeHtml(name)}</h3>
        
        <div class="project-members">
          <small>Участники:</small>
          <p>${escapeHtml(members)}</p>
        </div>

        <div class="card-footer">
          <span>📅 Дедлайн: <strong>${escapeHtml(deadline)}</strong></span>
        </div>
      </div>
    `;
  }).join('');
}

  function projectSkeletons() {
    return [1,2,3].map(function () {
      return '<div class="glass rounded-2xl p-4">' +
        '<div class="skel h-3 w-1/3 rounded mb-3 animate-shimmer"></div>' +
        '<div class="skel h-2.5 w-1/2 rounded mb-2 animate-shimmer"></div>' +
        '<div class="skel h-2.5 w-3/4 rounded mb-3 animate-shimmer"></div>' +
        '<div class="skel h-3 w-2/3 rounded animate-shimmer"></div>' +
      '</div>';
    }).join('');
  }

  function emptyState(text) {
    return '<div class="glass rounded-2xl p-6 text-center text-[13px] text-slate-400">' + escapeHTML(text) + '</div>';
  }

  function renderDeadlines() {
    const list = document.getElementById('deadlines-list');
    const deadlines = Array.isArray(state.schedule) ? state.schedule : [];

    if (!deadlines.length) {
      list.innerHTML = emptyState('Дедлайнов пока нет 🎉');
      return;
    }

    let sorted = deadlines.slice();

    if (currentSort === 'date') {
      sorted.sort(function (a, b) {
        const dateA = new Date(a.Date || a.date || '');
        const dateB = new Date(b.Date || b.date || '');
        return dateA - dateB;
      });
    } else if (currentSort === 'credits') {
      sorted.sort(function (a, b) {
        const credA = Number(a.Credits || a.credits || 0);
        const credB = Number(b.Credits || b.credits || 0);
        return credB - credA;
      });
    } else if (currentSort === 'points') {
      sorted.sort(function (a, b) {
        const ptsA = Number(a.Points || a.points || 0);
        const ptsB = Number(b.Points || b.points || 0);
        return ptsB - ptsA;
      });
    }

    list.innerHTML = sorted.map(function (item) {
      const subject = item.Subject || item.Предмет || 'Общее';
      const task = item.Task || item.Задание || 'Занятие';
      const date = item.Date || item.date || '';
      const type = item.Type || item.Тип || 'Дедлайн';
      const link = item.Link || item.Ссылка || '';
      const credits = item.Credits || item.credits || '';
      const points = item.Points || item.points || '';

      const creditsHtml = credits ? '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-blue-500/10 text-blue-300 border border-blue-500/20">🎓 ' + escapeHTML(credits) + ' кр.</span>' : '';
      const pointsHtml = points ? '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-md bg-amber-500/10 text-amber-300 border border-amber-500/20">⭐ ' + escapeHTML(points) + ' балл</span>' : '';
      const linkBtn = link ? '<a href="' + escapeAttr(link) + '" target="_blank" rel="noopener noreferrer" class="task-link-btn">🔗 Открыть в Telegram</a>' : '';

      return '<div class="glass rounded-2xl p-4">' +
        '<div class="flex items-start justify-between gap-3">' +
          '<div class="min-w-0">' +
            '<div class="text-[14.5px] font-bold truncate">' + escapeHTML(subject) + '</div>' +
            '<div class="text-[12.5px] text-slate-400 mt-0.5">' + escapeHTML(task) + '</div>' +
          '</div>' +
          '<span class="text-[11px] font-semibold px-2 py-1 rounded-lg bg-rose-500/15 text-rose-300 shrink-0">' + escapeHTML(type) + '</span>' +
        '</div>' +
        '<div class="flex flex-wrap items-center gap-2 mt-3 text-[12px] text-slate-400">' +
          '<span class="text-slate-300 font-medium">⏳ ' + escapeHTML(formatDate(date)) + '</span>' +
          creditsHtml +
          pointsHtml +
        '</div>' +
        (linkBtn ? '<div class="mt-3">' + linkBtn + '</div>' : '') +
      '</div>';
    }).join('');
  }

// Отрисовка карточек проектов на сайте
function renderProjects(projects) {
  const container = document.getElementById('projects-container');
  if (!container) return;

  if (!projects || projects.length === 0) {
    container.innerHTML = '<div class="empty">Проектов пока нет 🎉</div>';
    return;
  }

  // Фильтруем просроченные проекты
  const activeProjects = projects.filter(p => p.Status !== 'Expired' && p.Status !== 'Archived');

  container.innerHTML = activeProjects.map(item => {
    const maxCap = item.Max_Capacity || 0;
    const curCount = item.Current_Count || 0;
    const members = item.Members ? item.Members.split(',').join(', ') : 'Пока нет участников';
    const isFull = curCount >= maxCap;

    return `
      <div class="project-card ${isFull ? 'full' : ''}">
        <div class="card-header">
          <span class="badge-subject">${escapeHtml(item.Subject || 'Предмет не указан')}</span>
          <span class="badge-capacity ${isFull ? 'full-badge' : ''}">
            👥 ${curCount} / ${maxCap} мест
          </span>
        </div>
        
        <h3 class="project-title">${escapeHtml(item.Project_Name || 'Без названия')}</h3>
        
        <div class="project-members">
          <strong>Участники:</strong>
          <p>${escapeHtml(members)}</p>
        </div>

        <div class="card-footer">
          <span>📅 Дедлайн: <strong>${escapeHtml(item.Deadline || 'Не указан')}</strong></span>
        </div>
      </div>
    `;
  }).join('');
}

// Отрисовка предметов (с названиями, баллами и кредитами)
function renderGroups(groups) {
  const container = document.getElementById('groups-container');
  if (!container) return;

  container.innerHTML = groups.map(item => `
    <div class="subject-card">
      <h3>${escapeHtml(item.Subject || 'Название предмета')}</h3>
      <p>👨‍🏫 Преподаватель: ${escapeHtml(item.Teacher || 'Не указан')}</p>
      <div class="subject-meta">
        <span>🏆 Баллы: ${escapeHtml(item.Points || '100')}</span>
        <span>💳 Кредиты: ${escapeHtml(item.Credits || '3')}</span>
      </div>
      ${item.Drive_Link ? `<a href="${escapeHtml(item.Drive_Link)}" target="_blank" class="link-btn">📁 Материалы (Drive)</a>` : ''}
    </div>
  `).join('');
}

  function renderSyllabus() {
    const list = document.getElementById('syllabus-list');
    if (!state.syllabus.length) {
      list.innerHTML = emptyState('Силлабусы пока не загружены.');
      return;
    }

    list.innerHTML = state.syllabus.map(function (s) {
      const subject = s.Subject || s.Предмет || '';
      const instructor = s.Instructor || s.Преподаватель || '';
      const title = s.Title || '';
      const linkUrl = s.Link || s.Ссылка || '';
      const link = linkUrl
        ? '<a href="' + escapeAttr(linkUrl) + '" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1 text-[12.5px] font-semibold px-3 py-1.5 rounded-lg text-white bg-blue-500 hover:bg-blue-600 transition">📖 Открыть</a>'
        : '';

      return '<div class="glass rounded-2xl p-4">' +
        '<div class="text-[14.5px] font-bold">' + escapeHTML(subject) + '</div>' +
        (instructor ? '<div class="text-[12.5px] text-slate-400 mt-0.5">👤 ' + escapeHTML(instructor) + '</div>' : '') +
        '<div class="text-[12.5px] text-slate-500 mt-1">' + escapeHTML(title) + '</div>' +
        (link ? '<div class="mt-3">' + link + '</div>' : '') +
      '</div>';
    }).join('');
  }

  document.getElementById('group-search').addEventListener('input', function (e) {
    renderProjects(e.target.value.trim());
  });

  function formatDate(value) {
    if (!value) return '';
    const d = new Date(value);
    if (isNaN(d.getTime())) return escapeHTML(String(value));
    return d.toLocaleDateString('ru-RU', { weekday: 'short', month: 'short', day: 'numeric' });
  }

  function escapeHTML(str) {
    return String(str || '').replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function escapeAttr(str) { return escapeHTML(str); }

  loadAll();
})();
</script>
</body>
