<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      color: #1a202c;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 42px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin: 0;
      color: #718096;
      font-size: 16px;
    }

    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
      border-bottom: 2px solid rgba(255,255,255,.3);
      overflow-x: auto;
      padding: 0 0 8px;
    }

    .tab-btn {
      padding: 12px 24px;
      border: none;
      background: transparent;
      color: #718096;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all .3s ease;
      white-space: nowrap;
    }

    .tab-btn:hover {
      color: #4a5568;
    }

    .tab-btn.active {
      color: #667eea;
      border-bottom-color: #667eea;
    }

    .tab-content {
      display: none;
      animation: fadeIn .3s ease;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 4px 6px rgba(0,0,0,.07);
      border: 1px solid rgba(0,0,0,.05);
      transition: all .3s ease;
    }

    .card:hover {
      box-shadow: 0 12px 24px rgba(0,0,0,.12);
      transform: translateY(-4px);
    }

    .card h3, .card h2 {
      margin: 0 0 12px;
      font-size: 20px;
      color: #2d3748;
    }

    .card-meta {
      font-size: 14px;
      color: #718096;
      line-height: 1.6;
      margin: 8px 0;
    }

    .members-box {
      background: #f7fafc;
      border-left: 4px solid #667eea;
      padding: 12px;
      border-radius: 6px;
      margin-top: 16px;
      font-size: 13px;
      color: #4a5568;
    }

    .members-box strong {
      display: block;
      margin-bottom: 6px;
      color: #2d3748;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 8px;
    }

    .status-badge.active {
      background: #c6f6d5;
      color: #22543d;
    }

    .status-badge.expired {
      background: #fed7d7;
      color: #742a2a;
    }

    .join-btn {
      width: 100%;
      margin-top: 16px;
      padding: 12px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all .3s ease;
    }

    .join-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 8px 16px rgba(102, 126, 234, .4);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: min(500px, 100%);
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,.3);
    }

    .modal-content h2 {
      margin: 0 0 20px;
      font-size: 28px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 16px 0 6px;
      color: #2d3748;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border .2s;
    }

    input:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,.1);
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all .3s ease;
    }

    .btn-secondary {
      background: #e2e8f0;
      color: #2d3748;
    }

    .btn-secondary:hover {
      background: #cbd5e0;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 16px rgba(102, 126, 234, .4);
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 14px 24px;
      border-radius: 8px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
      z-index: 200;
      box-shadow: 0 8px 16px rgba(0,0,0,.2);
    }

    .toast.show {
      opacity: 1;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #718096;
    }

    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .task-item {
      padding: 16px;
      background: #f7fafc;
      border-left: 4px solid #667eea;
      margin-bottom: 12px;
      border-radius: 6px;
    }

    .task-item strong {
      color: #2d3748;
      display: block;
      margin-bottom: 4px;
    }

    .task-item .subject {
      font-size: 12px;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 4px;
    }

    .task-item .date {
      font-size: 13px;
      color: #667eea;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Class Hub</h1>
      <p class="subtitle">Твой помощник в учёбе — проекты, дедлайны и силлабус</p>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="projects">📦 Проекты</button>
      <button class="tab-btn" data-tab="deadlines">⏰ Дедлайны</button>
      <button class="tab-btn" data-tab="syllabus">📖 Силлабус</button>
    </div>

    <!-- ПРОЕКТЫ -->
    <div id="projects" class="tab-content active">
      <div id="projectsList" class="grid"></div>
    </div>

    <!-- ДЕДЛАЙНЫ -->
    <div id="deadlines" class="tab-content">
      <div id="deadlinesList" class="grid"></div>
    </div>

    <!-- СИЛЛАБУС -->
    <div id="syllabus" class="tab-content">
      <div id="syllabusList" class="grid"></div>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО -->
  <div class="modal" id="joinModal">
    <div class="modal-content">
      <h2>Подать заявку</h2>
      <label for="studentName">Имя</label>
      <input id="studentName" type="text" placeholder="Иван Петров" />
      
      <label for="studentTelegramId">Telegram ID или @username</label>
      <input id="studentTelegramId" type="text" placeholder="123456789 или @username" />
      
      <div class="actions">
        <button class="btn btn-secondary" id="cancelBtn">Отмена</button>
        <button class="btn btn-primary" id="submitJoinBtn">Отправить</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwMXejYR6g5kbdsNO_AS5MvUvI_OWRG3M9Z486-AiyImYXUCyCtB9zWm245JpCRvKQIkg/exec";
    let currentProjectId = null;

    const $ = (id) => document.getElementById(id);
    const escape = (str) => String(str ?? '').replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    }[c]));

    // ===== ВКЛАДКИ =====
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const tabName = e.target.dataset.tab;
        
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        
        e.target.classList.add('active');
        $(tabName).classList.add('active');
      });
    });

    // ===== МОДАЛЬНОЕ ОКНО =====
    function openModal() {
      $('joinModal').classList.add('open');
    }

    function closeModal() {
      $('joinModal').classList.remove('open');
      $('studentName').value = '';
      $('studentTelegramId').value = '';
      currentProjectId = null;
    }

    $('cancelBtn').addEventListener('click', closeModal);
    $('joinModal').addEventListener('click', (e) => {
      if (e.target === $('joinModal')) closeModal();
    });

    // ===== ОТПРАВКА ЗАЯВКИ =====
    $('submitJoinBtn').addEventListener('click', async () => {
      const studentName = $('studentName').value.trim();
      const studentId = $('studentTelegramId').value.trim();
      
      if (!currentProjectId || !studentName || !studentId) {
        alert('Пожалуйста, заполните все поля.');
        return;
      }

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'joinProjectRequest',
            projectId: currentProjectId,
            studentId: studentId,
            studentName: studentName
          })
        });

        closeModal();
        showToast('✅ Заявка отправлена лидеру проекта!');
      } catch (error) {
        alert('❌ Ошибка отправки. Попробуйте позже.');
      }
    });

    // ===== УВЕДОМЛЕНИЯ =====
    function showToast(message) {
      const toast = $('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // ===== ПРОЕКТЫ =====
    function renderProjects(projects) {
      const container = $('projectsList');
      if (!Array.isArray(projects) || projects.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #a0aec0;"><div style="font-size: 48px; margin-bottom: 12px;">📭</div>Активных проектов пока нет</div>';
        return;
      }

      container.innerHTML = projects.map(p => `
        <div class="card">
          <h3>${escape(p.projectName || 'Без названия')}</h3>
          <div class="card-meta"><strong>📚 Предмет:</strong> ${escape(p.subject || '—')}</div>
          <div class="card-meta"><strong>📅 Дедлайн:</strong> ${escape(p.deadline || '—')}</div>
          <div class="card-meta"><strong>👥 Свободно:</strong> ${Number(p.availableSpots || 0)}/${Number(p.maxCapacity || 0)}</div>
          <div class="members-box">
            <strong>Участники:</strong>
            ${Array.isArray(p.approvedMembers) && p.approvedMembers.length ? p.approvedMembers.map(m => escape(m)).join(', ') : 'Нет участников'}
          </div>
          <span class="status-badge active">Активный</span>
          <button class="join-btn" onclick="currentProjectId='${escape(p.projectId)}'; openModal();">Подать заявку</button>
        </div>
      `).join('');
    }

    async function loadProjects() {
      try {
        const response = await fetch(GAS_URL, { method: 'GET' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        renderProjects(Array.isArray(data) ? data : data.projects || []);
      } catch (error) {
        console.error('Ошибка загрузки проектов:', error);
        renderProjects([]);
      }
    }

    // ===== ДЕДЛАЙНЫ =====
    function renderDeadlines(deadlines) {
      const container = $('deadlinesList');
      if (!Array.isArray(deadlines) || deadlines.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #a0aec0;"><div style="font-size: 48px; margin-bottom: 12px;">✨</div>Дедлайнов не найдено</div>';
        return;
      }

      container.innerHTML = deadlines.slice(0, 12).map(d => `
        <div class="card">
          <h3>${escape(d.Subject || 'Без предмета')}</h3>
          <div class="card-meta"><strong>Задание:</strong> ${escape(d.Task || '—')}</div>
          <div class="card-meta"><strong>📅 До:</strong> ${escape(d.Date || '—')}</div>
          <div class="card-meta"><strong>Тип:</strong> ${escape(d.Type || 'Дедлайн')}</div>
          ${d.Points ? `<div class="card-meta"><strong>Баллы:</strong> ${escape(d.Points)}</div>` : ''}
          ${d.Link ? `<div style="margin-top: 12px;"><a href="${escape(d.Link)}" target="_blank" style="color: #667eea; text-decoration: none; font-weight: 600;">→ Открыть ссылку</a></div>` : ''}
        </div>
      `).join('');
    }

    async function loadDeadlines() {
      try {
        const response = await fetch(GAS_URL, { method: 'GET' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        const deadlines = data.deadlines || [];
        renderDeadlines(deadlines);
      } catch (error) {
        console.error('Ошибка загрузки дедлайнов:', error);
        renderDeadlines([]);
      }
    }

    // ===== СИЛЛАБУС =====
    function renderSyllabus(syllabus) {
      const container = $('syllabusList');
      if (!Array.isArray(syllabus) || syllabus.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #a0aec0;"><div style="font-size: 48px; margin-bottom: 12px;">📚</div>Силлабус не заполнен</div>';
        return;
      }

      container.innerHTML = syllabus.slice(0, 12).map(s => `
        <div class="card">
          <h3>${escape(s.Subject || 'Без названия')}</h3>
          <div class="card-meta"><strong>Тема:</strong> ${escape(s.Theme || '—')}</div>
        </div>
      `).join('');
    }

    async function loadSyllabus() {
      try {
        const response = await fetch(GAS_URL, { method: 'GET' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        const syllabus = data.syllabus || [];
        renderSyllabus(syllabus);
      } catch (error) {
        console.error('Ошибка загрузки силлабуса:', error);
        renderSyllabus([]);
      }
    }

    // ===== ИНИЦИАЛИЗАЦИЯ =====
    loadProjects();
    loadDeadlines();
    loadSyllabus();
  </script>
</body>
</html>
