<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Hub — проекты</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; color: #0f172a; background: #f4f7fb; }
    header { max-width: 1100px; margin: 0 auto 24px; }
    h1 { margin: 0 0 8px; font-size: clamp(28px, 5vw, 42px); }
    .subtitle { margin: 0; color: #475569; }
    .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; max-width: 1100px; margin: 0 auto; }
    .project-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; padding: 20px; box-shadow: 0 6px 18px rgba(15,23,42,.08); }
    .project-card h2 { margin: 0 0 12px; font-size: 22px; }
    .meta { color: #475569; line-height: 1.6; margin: 6px 0; }
    .members { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: #f8fafc; color: #334155; font-size: 14px; }
    .join-btn { width: 100%; margin-top: 16px; border: 0; border-radius: 10px; padding: 12px 18px; background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
    .join-btn:hover { background: #1d4ed8; }
    .status { grid-column: 1 / -1; padding: 22px; text-align: center; color: #475569; background: #fff; border: 1px solid #e5e7eb; border-radius: 16px; }
    .modal { position: fixed; inset: 0; display: none; place-items: center; padding: 20px; background: rgba(15,23,42,.5); z-index: 10; }
    .modal.open { display: grid; }
    .modal-content { width: min(420px, 100%); padding: 24px; background: #fff; border-radius: 18px; box-shadow: 0 12px 32px rgba(0,0,0,.15); }
    .modal-content h2 { margin: 0 0 18px; }
    label { display: block; margin: 12px 0 6px; font-size: 14px; font-weight: 600; }
    input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; }
    .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
    button.secondary, button.primary { border: 0; border-radius: 10px; padding: 11px 16px; font-weight: 600; cursor: pointer; }
    .secondary { background: #e2e8f0; color: #0f172a; } .primary { background: #10b981; color: #fff; }
    .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 12px 18px; border-radius: 10px; background: #0f172a; color: #fff; opacity: 0; transition: opacity .2s; z-index: 20; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header><h1>Class Hub</h1><p class="subtitle">Учебные проекты и команды</p></header>
  <main class="projects" id="projectsList"><div class="status">Загрузка проектов…</div></main>

  <div class="modal" id="joinModal" aria-hidden="true">
    <div class="modal-content">
      <h2>Подать заявку</h2>
      <label for="studentName">Имя</label><input id="studentName" type="text" placeholder="Иван" />
      <label for="studentTelegramId">Telegram ID или @username</label><input id="studentTelegramId" type="text" placeholder="123456789 или @ivan" />
      <div class="actions"><button class="secondary" id="cancelBtn">Отмена</button><button class="primary" id="submitJoinBtn">Отправить заявку</button></div>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwMXejYR6g5kbdsNO_AS5MvUvI_OWRG3M9Z486-AiyImYXUCyCtB9zWm245JpCRvKQIkg/exec';
    let currentProjectId = null;
    const $ = (id) => document.getElementById(id);
    const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));

    function renderProjects(projects) {
      const container = $('projectsList');
      if (!Array.isArray(projects) || projects.length === 0) {
        container.innerHTML = '<div class="status">Активных проектов пока нет.</div>';
        return;
      }
      container.innerHTML = projects.map((project) => {
        const members = Array.isArray(project.approvedMembers) && project.approvedMembers.length ? project.approvedMembers.join(', ') : 'Нет участников';
        return `<article class="project-card"><h2>${escapeHtml(project.projectName || 'Без названия')}</h2>
          <div class="meta"><b>Предмет:</b> ${escapeHtml(project.subject || '—')}</div>
          <div class="meta"><b>Дедлайн:</b> ${escapeHtml(project.deadline || '—')}</div>
          <div class="meta"><b>Свободно:</b> ${Number(project.availableSpots || 0)}/${Number(project.maxCapacity || 0)}</div>
          <div class="members"><b>Участники:</b><br>${escapeHtml(members)}</div>
          <button class="join-btn" data-project-id="${escapeHtml(project.projectId)}">Подать заявку на участие</button></article>`;
      }).join('');
      document.querySelectorAll('.join-btn').forEach((button) => button.addEventListener('click', () => { currentProjectId = button.dataset.projectId; $('joinModal').classList.add('open'); }));
    }

    async function loadProjects() {
      try {
        const response = await fetch(GAS_URL, { method: 'GET', redirect: 'follow' });
        if (!response.ok) throw new Error('HTTP ' + response.status);
        const data = await response.json();
        renderProjects(Array.isArray(data) ? data : data.projects);
      } catch (error) {
        console.error('Не удалось загрузить проекты:', error);
        renderProjects([]);
      }
    }

    function closeModal() { $('joinModal').classList.remove('open'); $('studentName').value = ''; $('studentTelegramId').value = ''; currentProjectId = null; }
    $('cancelBtn').addEventListener('click', closeModal);
    $('joinModal').addEventListener('click', (event) => { if (event.target === $('joinModal')) closeModal(); });
    $('submitJoinBtn').addEventListener('click', async () => {
      const studentName = $('studentName').value.trim();
      const studentId = $('studentTelegramId').value.trim();
      if (!currentProjectId || !studentName || !studentId) return alert('Введите имя и Telegram ID.');
      try {
        await fetch(GAS_URL, { method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({ action: 'joinProjectRequest', projectId: currentProjectId, studentId, studentName }) });
        closeModal(); alert('Заявка отправлена лидеру проекта.');
      } catch (error) { alert('Ошибка соединения с сервером.'); }
    });
    loadProjects();
  </script>
</body>
</html>
