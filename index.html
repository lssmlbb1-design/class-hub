<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Class Hub</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 24px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .project-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      padding: 20px;
      border: 1px solid #e5e7eb;
    }

    .project-card h3 {
      margin: 0 0 8px;
      font-size: 22px;
    }

    .meta {
      color: #475569;
      line-height: 1.6;
      margin: 6px 0;
    }

    .members {
      margin-top: 12px;
      font-size: 14px;
      color: #334155;
      background: #f8fafc;
      border-radius: 10px;
      padding: 10px 12px;
    }

    .join-btn {
      margin-top: 16px;
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      cursor: pointer;
      font-weight: 600;
    }

    .join-btn:hover {
      background: #1d4ed8;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      width: min(420px, 90vw);
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,.15);
    }

    .modal-content h2 {
      margin-top: 0;
      margin-bottom: 18px;
      font-size: 26px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px 14px;
      margin-bottom: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 6px;
    }

    .secondary, .primary {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    .primary {
      background: #10b981;
      color: white;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 30;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="projects" id="projectsList"></div>

  <div class="modal" id="joinModal">
    <div class="modal-content">
      <h2>Подать заявку</h2>

      <label for="studentName">Имя</label>
      <input id="studentName" type="text" placeholder="Иван" />

      <label for="studentTelegramId">Telegram ID или @username</label>
      <input id="studentTelegramId" type="text" placeholder="123456789 или @ivan" />

      <div class="actions">
        <button class="secondary" id="cancelBtn">Отмена</button>
        <button class="primary" id="submitJoinBtn">Отправить заявку</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
// URL вашего развернутого Google Apps Script
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwMXejYR6g5kbdsNO_AS5MvUvI_OWRG3M9Z486-AiyImYXUCyCtB9zWm245JpCRvKQIkg/exec"; 
  
  // 1. Подача заявки на участие с сайта
  async function applyForProject(projectId) {
    const studentId = prompt("Введите ваш Telegram ID (узнать можно у @userinfobot):");
    if (!studentId) return;
  
    const studentName = prompt("Введите ваше Имя / ФИО:");
    if (!studentName) return;
  
    try {
      const response = await fetch(GAS_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "joinProjectRequest",
          projectId: projectId,
          studentId: studentId.trim(),
          studentName: studentName.trim()
        })
      });
  
      const result = await response.json();
  
      if (result.status === "success") {
        alert("✅ Заявка успешно отправлена лидеру проекта в Telegram!");
      } else {
        alert("❌ Ошибка: " + (result.message || "Не удалось отправить заявку."));
      }
    } catch (err) {
      alert("❌ Ошибка соединения с сервером.");
      console.error(err);
    }
}

    function renderProjects(projects) {
      const container = document.getElementById('projectsList');

      if (!projects || projects.length === 0) {
        container.innerHTML = '<div class="project-card"><h3>Проекты</h3><div class="meta">Активных проектов пока нет.</div></div>';
        return;
      }

      container.innerHTML = '';

      projects.forEach((project) => {
        const card = document.createElement('div');
        card.className = 'project-card';

        const members = Array.isArray(project.approvedMembers) && project.approvedMembers.length
          ? project.approvedMembers.join(', ')
          : 'Нет участников';

        const free = Number(project.availableSpots || 0);
        const total = Number(project.maxCapacity || 0);

        card.innerHTML = `
          <h3>${escapeHtml(project.projectName || 'Без названия')}</h3>
          <div class="meta"><strong>Предмет:</strong> ${escapeHtml(project.subject || '—')}</div>
          <div class="meta"><strong>Дедлайн:</strong> ${escapeHtml(project.deadline || '—')}</div>
          <div class="meta"><strong>Свободно:</strong> ${free}/${total}</div>

          <div class="members">
            <strong>Участники:</strong><br>
            ${escapeHtml(members)}
          </div>

          <button class="join-btn" data-project-id="${project.projectId}">
            Подать заявку на участие
          </button>
        `;

        container.appendChild(card);
      });

      document.querySelectorAll('.join-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          currentProjectId = btn.dataset.projectId;
          openModal();
        });
      });
    }

    function bindModalEvents() {
      document.getElementById('cancelBtn').addEventListener('click', closeModal);
      document.getElementById('submitJoinBtn').addEventListener('click', sendJoinRequest);
      document.getElementById('joinModal').addEventListener('click', (e) => {
        if (e.target.id === 'joinModal') closeModal();
      });
    }

    function openModal() {
      document.getElementById('joinModal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('joinModal').classList.remove('open');
      document.getElementById('studentName').value = '';
      document.getElementById('studentTelegramId').value = '';
      currentProjectId = null;
    }

    async function sendJoinRequest() {
      const studentName = document.getElementById('studentName').value.trim();
      const studentTelegramId = document.getElementById('studentTelegramId').value.trim();

      if (!currentProjectId) {
        alert('Выберите проект.');
        return;
      }

      if (!studentName || !studentTelegramId) {
        alert('Введите имя и Telegram ID.');
        return;
      }

      const payload = {
        action: 'joinProjectRequest',
        projectId: currentProjectId,
        studentId: studentTelegramId,
        studentName: studentName
      };

      try {
        const response = await fetch(GAS_URL, {
          method: 'POST',
          mode: 'cors',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const text = await response.text();
        let data = {};
        try {
          data = JSON.parse(text);
        } catch (e) {
          data = { ok: false, error: text };
        }

        if (!response.ok || data.ok === false) {
          throw new Error(data.error || 'Не удалось отправить заявку.');
        }

        showToast('Заявка отправлена лидеру!');
        closeModal();
      } catch (error) {
        console.error(error);
        alert(error.message || 'Ошибка отправки заявки.');
      }
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');

      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
