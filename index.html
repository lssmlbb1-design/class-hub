<!-- <!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Class Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: { base: '#0B1120', panel: '#111A2E' },
        keyframes: {
          pulseDot: {
            '0%, 100%': { boxShadow: '0 0 0 0 rgba(52, 211, 153, 0.55)' },
            '70%': { boxShadow: '0 0 0 6px rgba(52, 211, 153, 0)' },
          },
          shimmer: {
            '0%': { backgroundPosition: '100% 0' },
            '100%': { backgroundPosition: '0 0' },
          },
        },
        animation: {
          pulseDot: 'pulseDot 2s infinite',
          shimmer: 'shimmer 1.6s ease infinite',
        },
      },
    },
  };
</script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #0B1120; }
  body { font-family: 'Inter', system-ui, sans-serif; }

  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.08);
  }
  .glass-strong {
    background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.10);
  }

  ::-webkit-scrollbar { display: none; }
  * { scrollbar-width: none; }

  .skel {
    background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.10) 37%, rgba(255,255,255,0.05) 63%);
    background-size: 400% 100%;
  }

  .tab-underline { position: relative; }
  .tab-underline.active::after {
    content: '';
    position: absolute;
    left: 14px; right: 14px; bottom: -1px;
    height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, #60A5FA, #34D399);
  }

  button, a { -webkit-tap-highlight-color: transparent; }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid #60A5FA;
    outline-offset: 2px;
  }

  .fade-in { animation: fadeIn 0.25s ease both; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  @media (prefers-reduced-motion: reduce) {
    .animate-pulseDot, .animate-shimmer, .fade-in { animation: none !important; }
  }
</style>
</head>
<body class="text-slate-100 min-h-screen flex flex-col">

<header class="sticky top-0 z-20 px-4 pt-4 pb-3" style="padding-top: calc(env(safe-area-inset-top, 0px) + 16px); background: linear-gradient(180deg, #0B1120 70%, rgba(11,17,32,0.85) 100%);">
  <div class="flex items-center gap-3">
    <div class="relative shrink-0">
      <div id="avatar" class="h-11 w-11 rounded-2xl glass-strong flex items-center justify-center text-sm font-bold text-slate-100">CH</div>
      <span class="absolute -bottom-0.5 -right-0.5 h-3 w-3 rounded-full bg-emerald-400 ring-2 ring-[#0B1120] animate-pulseDot" aria-hidden="true"></span>
    </div>
    <div class="min-w-0">
      <h1 class="text-[17px] font-bold leading-tight tracking-tight">Class Hub</h1>
      <p id="greeting" class="text-[12.5px] text-slate-400 truncate">Твой центр учебных данных</p>
    </div>
  </div>
</header>

<nav class="sticky top-[68px] z-20 px-4 pb-2" style="background: #0B1120;" role="tablist">
  <div class="flex gap-1 border-b border-white/10">
    <button data-view="schedule" class="tab-btn tab-underline active flex-1 py-2.5 text-[13px] font-semibold text-slate-100" role="tab" aria-selected="true">📅 Расписание</button>
    <button data-view="groups" class="tab-btn tab-underline flex-1 py-2.5 text-[13px] font-semibold text-slate-400" role="tab" aria-selected="false">👥 Группы</button>
    <button data-view="syllabus" class="tab-btn tab-underline flex-1 py-2.5 text-[13px] font-semibold text-slate-400" role="tab" aria-selected="false">📚 Силлабусы</button>
  </div>
</nav>

<main class="flex-1 px-4 pt-3 pb-8 overflow-y-auto">
  <div id="error-slot" role="alert"></div>

  <section id="view-schedule" class="view fade-in">
    <div id="schedule-list" class="space-y-2.5"></div>
  </section>

  <section id="view-groups" class="view hidden">
    <div class="relative mb-3">
      <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <label for="group-search" class="sr-only">Поиск по имени или username</label>
      <input id="group-search" type="text" placeholder="Имя или @username…"
        class="w-full glass rounded-xl pl-9 pr-3 py-2.5 text-[13.5px] text-slate-100 placeholder:text-slate-500 outline-none" />
    </div>
    <div id="groups-list" class="space-y-2.5"></div>
  </section>

  <section id="view-syllabus" class="view hidden">
    <div id="syllabus-list" class="space-y-2.5"></div>
  </section>
</main>

<script>
(function () {
  const API_URL = 'https://script.google.com/macros/s/AKfycbzNjMx0uo7q4nh9KPOQgk68EieQbBYTmZVvOouIM9E21ried7oDQy167Nt3tGbXDO8oKw/exec';

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    if (tg.setHeaderColor) { try { tg.setHeaderColor('#0B1120'); } catch (e) {} }
    if (tg.setBackgroundColor) { try { tg.setBackgroundColor('#0B1120'); } catch (e) {} }
  }

  const currentUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;

  function haptic(style) {
    if (tg && tg.HapticFeedback) {
      try { tg.HapticFeedback.impactOccurred(style || 'light'); } catch (e) {}
    }
  }

  (function personalize() {
    const firstName = currentUser && currentUser.first_name;
    if (firstName) {
      document.getElementById('greeting').textContent = 'Привет, ' + firstName + ' 👋';
      const initials = (firstName[0] || 'C') + ((currentUser.last_name || '')[0] || '');
      document.getElementById('avatar').textContent = initials.toUpperCase();
    }
  })();

  const tabButtons = document.querySelectorAll('.tab-btn');
  const views = {
    schedule: document.getElementById('view-schedule'),
    groups: document.getElementById('view-groups'),
    syllabus: document.getElementById('view-syllabus')
  };

  tabButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      haptic('light');
      tabButtons.forEach(function (b) {
        b.classList.remove('active', 'text-slate-100');
        b.classList.add('text-slate-400');
        b.setAttribute('aria-selected', 'false');
      });
      btn.classList.add('active', 'text-slate-100');
      btn.classList.remove('text-slate-400');
      btn.setAttribute('aria-selected', 'true');
      Object.keys(views).forEach(function (k) { views[k].classList.add('hidden'); });
      const target = views[btn.dataset.view];
      target.classList.remove('hidden');
      target.classList.remove('fade-in'); void target.offsetWidth; target.classList.add('fade-in');
    });
  });

  if (tg) {
    tg.MainButton.setText('Обновить данные');
    tg.MainButton.onClick(function () { haptic('medium'); loadData(); });
    tg.MainButton.show();
  }

  function skeletonCard() {
    return '<div class="glass rounded-2xl p-4">' +
      '<div class="skel h-3 w-2/5 rounded mb-3 animate-shimmer"></div>' +
      '<div class="skel h-2.5 w-3/5 rounded mb-2 animate-shimmer"></div>' +
      '<div class="skel h-2.5 w-4/5 rounded animate-shimmer"></div>' +
    '</div>';
  }
  function showSkeletons() {
    ['schedule-list', 'groups-list', 'syllabus-list'].forEach(function (id) {
      document.getElementById(id).innerHTML = skeletonCard() + skeletonCard() + skeletonCard();
    });
  }
  showSkeletons();

  let state = { schedule: [], groups: [], syllabus: [] };

  function loadData() {
    document.getElementById('error-slot').innerHTML = '';
    fetch(API_URL + '?action=getAll')
      .then(function (res) {
        if (!res.ok) throw new Error('Ошибка сети: ' + res.status);
        return res.json();
      })
      .then(function (json) {
        if (!json.ok) throw new Error(json.error || 'Неизвестная ошибка API');
        state.schedule = json.data.schedule || [];
        state.groups = json.data.groups || [];
        state.syllabus = json.data.syllabus || [];
        renderSchedule();
        renderGroups();
        renderSyllabus();
      })
      .catch(function (err) {
        document.getElementById('error-slot').innerHTML =
          '<div class="glass rounded-xl p-3 mb-3 text-[13px] text-rose-300" style="border-color: rgba(251,113,133,0.25);">Не удалось загрузить данные: ' + escapeHTML(err.message) + '</div>';
        ['schedule-list', 'groups-list', 'syllabus-list'].forEach(function (id) {
          document.getElementById(id).innerHTML = emptyState('Нет данных.');
        });
      });
  }

  function emptyState(text) {
    return '<div class="glass rounded-2xl p-6 text-center text-[13px] text-slate-400">' + escapeHTML(text) + '</div>';
  }

  function typeBadge(type) {
    const t = String(type || 'Задание').toLowerCase();
    const map = {
      'лекция': 'bg-blue-500/15 text-blue-300', 'lecture': 'bg-blue-500/15 text-blue-300',
      'дз': 'bg-amber-500/15 text-amber-300', 'homework': 'bg-amber-500/15 text-amber-300',
      'дедлайн': 'bg-rose-500/15 text-rose-300', 'deadline': 'bg-rose-500/15 text-rose-300'
    };
    const cls = map[t] || 'bg-slate-500/15 text-slate-300';
    return '<span class="text-[11px] font-semibold px-2 py-1 rounded-lg ' + cls + '">' + escapeHTML(type || 'Задание') + '</span>';
  }

  function renderSchedule() {
    const list = document.getElementById('schedule-list');
    if (!state.schedule.length) { list.innerHTML = emptyState('Дедлайнов пока нет 🎉'); return; }

    const sorted = state.schedule.slice().sort(function (a, b) { return new Date(a.Date) - new Date(b.Date); });
    list.innerHTML = sorted.map(function (item) {
      const dateLabel = formatDate(item.Date);
      const link = item.Link
        ? '<a href="' + escapeAttr(item.Link) + '" target="_blank" class="tap-link mt-3 inline-flex items-center gap-1 text-[12.5px] font-semibold px-3 py-1.5 rounded-lg text-white" style="background: linear-gradient(90deg, #3B82F6, #22D3EE);">Открыть →</a>'
        : '';
      return '<div class="glass rounded-2xl p-4">' +
        '<div class="flex items-start justify-between gap-3">' +
          '<div class="min-w-0">' +
            '<div class="text-[14.5px] font-bold truncate">' + escapeHTML(item.Subject || 'Общее') + '</div>' +
            '<div class="text-[12.5px] text-slate-400 mt-0.5">' + escapeHTML(item.Task || '') + '</div>' +
          '</div>' +
          typeBadge(item.Type) +
        '</div>' +
        '<div class="text-[12px] text-slate-500 mt-2.5">📆 ' + dateLabel + '</div>' +
        link +
      '</div>';
    }).join('');
    bindTapHaptics(list);
  }

  function renderGroups(filterText) {
    const list = document.getElementById('groups-list');
    let rows = state.groups;
    if (!rows.length) { list.innerHTML = emptyState('Нет данных о группах.'); return; }

    if (filterText) {
      const q = filterText.toLowerCase();
      rows = rows.filter(function (r) {
        return (String(r.Name || '').toLowerCase().indexOf(q) > -1) ||
               (String(r.Username || '').toLowerCase().indexOf(q) > -1);
      });
    }
    if (!rows.length) { list.innerHTML = emptyState('Совпадений не найдено.'); return; }

    list.innerHTML = rows.map(function (r) {
      const isMe = currentUser && currentUser.username &&
        String(r.Username || '').replace('@', '').toLowerCase() === currentUser.username.toLowerCase();
      return '<div class="glass rounded-2xl p-4' + (isMe ? ' ring-1 ring-blue-400/40' : '') + '">' +
        '<div class="flex items-center justify-between gap-2">' +
          '<div class="text-[14.5px] font-bold">' + escapeHTML(r.Name || '') + '</div>' +
          (isMe ? '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-lg bg-blue-500/15 text-blue-300">Вы</span>' : '') +
        '</div>' +
        '<div class="text-[12px] text-slate-500 mb-2">' + escapeHTML(r.Username || '') + '</div>' +
        '<div class="flex flex-wrap gap-1.5 text-[12px]">' +
          groupChip('🇬🇧', r.EnglishGroup) + groupChip('🇰🇬', r.KyrgyzGroup) + groupChip('🧩', r.ProjectTeam) +
        '</div>' +
      '</div>';
    }).join('');
  }

  function groupChip(icon, value) {
    if (!value) return '';
    return '<span class="glass px-2.5 py-1 rounded-lg text-slate-300">' + icon + ' ' + escapeHTML(value) + '</span>';
  }

  function renderSyllabus() {
    const list = document.getElementById('syllabus-list');
    if (!state.syllabus.length) { list.innerHTML = emptyState('Силлабусы пока не загружены.'); return; }

    list.innerHTML = state.syllabus.map(function (s) {
      const link = s.Link
        ? '<a href="' + escapeAttr(s.Link) + '" target="_blank" class="tap-link inline-flex items-center gap-1 text-[12.5px] font-semibold px-3 py-1.5 rounded-lg text-white" style="background: linear-gradient(90deg, #6366F1, #22D3EE);">📄 Скачать PDF</a>'
        : '';
      return '<div class="glass rounded-2xl p-4">' +
        '<div class="text-[14.5px] font-bold">' + escapeHTML(s.Subject || '') + '</div>' +
        (s.Instructor ? '<div class="text-[12.5px] text-slate-400 mt-0.5">👤 ' + escapeHTML(s.Instructor) + '</div>' : '') +
        '<div class="text-[12.5px] text-slate-500 mt-1">' + escapeHTML(s.Title || '') + '</div>' +
        '<div class="mt-3">' + link + '</div>' +
      '</div>';
    }).join('');
    bindTapHaptics(list);
  }

  function bindTapHaptics(container) {
    container.querySelectorAll('a.tap-link').forEach(function (a) {
      a.addEventListener('click', function () { haptic('light'); });
    });
  }

  document.getElementById('group-search').addEventListener('input', function (e) {
    renderGroups(e.target.value.trim());
  });

  function formatDate(value) {
    const d = new Date(value);
    if (isNaN(d.getTime())) return escapeHTML(String(value || ''));
    return d.toLocaleDateString('ru-RU', { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function escapeAttr(str) { return escapeHTML(str); }

  loadData();
})();


<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Class Hub Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      -webkit-tap-highlight-color: transparent;
    }
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .active-tab {
      background: #38bdf8;
      color: #0f172a;
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.35);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-6 select-none bg-slate-900 text-slate-100">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass-card px-4 py-3.5 flex justify-between items-center border-b border-slate-800">
    <div class="flex items-center space-x-2.5">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-500 flex items-center justify-center font-bold text-white shadow-lg shadow-sky-500/20 text-sm">
        CH
      </div>
      <div>
        <h1 class="text-base font-bold leading-none text-white tracking-tight">Class Hub</h1>
        <span class="text-[11px] text-sky-400 font-medium">AUCA Student Space</span>
      </div>
    </div>
    <div id="user-badge" class="px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700/80 text-xs text-slate-300 font-medium flex items-center gap-1.5">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="user-name">Студент</span>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <div class="p-3">
    <nav class="grid grid-cols-3 gap-1 bg-slate-900/90 p-1 rounded-2xl border border-slate-800 text-xs font-semibold">
      <button onclick="switchTab('schedule')" id="tab-schedule" class="py-2.5 rounded-xl transition-all duration-200 active-tab">📅 Расписание</button>
      <button onclick="switchTab('groups')" id="tab-groups" class="py-2.5 rounded-xl transition-all duration-200 text-slate-400 hover:text-slate-200">👥 Группы</button>
      <button onclick="switchTab('syllabus')" id="tab-syllabus" class="py-2.5 rounded-xl transition-all duration-200 text-slate-400 hover:text-slate-200">📚 Силлобусы</button>
    </nav>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 px-3 space-y-3">

    <!-- Loader -->
    <div id="loader" class="flex flex-col items-center justify-center py-16 space-y-3">
      <div class="w-9 h-9 border-3 border-sky-400 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-xs text-slate-400 font-medium animate-pulse">Синхронизация с Google Sheets...</p>
    </div>

    <!-- Section 1: Schedule -->
    <section id="sec-schedule" class="space-y-2.5">
      <!-- Cards rendered here -->
    </section>

    <!-- Section 2: Groups -->
    <section id="sec-groups" class="hidden space-y-3">
      <div class="relative">
        <input type="text" id="search-group" oninput="filterGroups()" placeholder="🔍 Поиск студента, предмета или подгруппы..." 
               class="w-full pl-3.5 pr-4 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700/80 text-xs text-slate-100 placeholder-slate-400 focus:outline-none focus:border-sky-400 transition-colors">
      </div>
      <div id="groups-list" class="space-y-2"></div>
    </section>

    <!-- Section 3: Syllabus -->
    <section id="sec-syllabus" class="hidden space-y-2.5">
      <div id="syllabus-list" class="space-y-2.5"></div>
    </section>

  </main>

  <script>

    const API_URL = 'https://script.google.com/macros/s/AKfycby-icr42VgUCDdTA_WDeoSSZ_58FHBZjNJgdsuURzR2LbSADfjS_s30eCWEPiDqEHad7A/exec';

    let appData = { schedule: [], groups: [], syllabus: [] };

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
      }
    }

    async function loadData() {
      try {
        const res = await fetch(`${API_URL}?action=getAll`);
        const json = await res.json();
        
        if (json.ok) {
          appData = json.data;
          renderSchedule();
          renderGroups();
          renderSyllabus();
        }
      } catch (err) {
        console.error('Ошибка:', err);
      } finally {
        document.getElementById('loader').classList.add('hidden');
      }
    }

    function switchTab(tab) {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

      ['schedule', 'groups', 'syllabus'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        const tabBtn = document.getElementById(`tab-${t}`);
        tabBtn.className = 'py-2.5 rounded-xl transition-all duration-200 text-slate-400 hover:text-slate-200';
      });

      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'py-2.5 rounded-xl transition-all duration-200 active-tab';
    }

    function renderSchedule() {
      const container = document.getElementById('sec-schedule');
      if (!appData.schedule || appData.schedule.length === 0) {
        container.innerHTML = '<div class="text-center text-slate-500 py-10 text-xs">Заданий и расписания пока нет 🚀</div>';
        return;
      }

      container.innerHTML = appData.schedule.map(item => `
        <div class="glass-card p-3.5 rounded-2xl space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-[10px] font-bold tracking-wider uppercase px-2.5 py-1 rounded-lg bg-sky-500/15 text-sky-300 border border-sky-500/30">
              ${item.Subject || item.Предмет || 'Курс'}
            </span>
            <span class="text-[11px] text-slate-400 font-medium">
              📅 ${item.Date ? String(item.Date).split('T')[0] : 'Скоро'}
            </span>
          </div>
          <p class="text-xs font-medium text-slate-100 leading-snug">
            ${item.Task || item.Задание || 'Занятие'}
          </p>
          <div class="flex items-center justify-between text-[11px] text-slate-400 pt-1 border-t border-slate-700/50">
            <span>📌 ${item.Type || item.Тип || 'ДЗ / Семинар'}</span>
            <span class="text-emerald-400 font-medium">Активно</span>
          </div>
