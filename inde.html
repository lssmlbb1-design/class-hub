<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Hub Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen pb-16">

  <!-- Header -->
  <header class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center sticky top-0 z-10">
    <h1 class="text-lg font-bold text-sky-400">🎓 Class Hub</h1>
    <span id="user-name" class="text-xs text-slate-400">Студент</span>
  </header>

  <!-- Navigation Tabs -->
  <nav class="flex justify-around bg-slate-800/80 backdrop-blur border-b border-slate-700 text-sm">
    <button onclick="switchTab('schedule')" id="tab-schedule" class="py-3 px-4 border-b-2 border-sky-400 font-semibold text-sky-400">Расписание</button>
    <button onclick="switchTab('groups')" id="tab-groups" class="py-3 px-4 border-b-2 border-transparent text-slate-400">Группы</button>
    <button onclick="switchTab('syllabus')" id="tab-syllabus" class="py-3 px-4 border-b-2 border-transparent text-slate-400">Силлобусы</button>
  </nav>

  <!-- Main Container -->
  <main class="p-4 max-w-md mx-auto">
    <!-- Loader -->
    <div id="loader" class="text-center py-10">
      <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-sky-400 border-t-transparent"></div>
      <p class="text-slate-400 mt-2 text-sm">Загрузка данных из таблицы...</p>
    </div>

    <!-- Section: Schedule -->
    <section id="sec-schedule" class="space-y-3">
      <!-- Динамически заполняется из JS -->
    </section>

    <!-- Section: Groups -->
    <section id="sec-groups" class="hidden space-y-3">
      <input type="text" id="search-group" oninput="filterGroups()" placeholder="🔍 Введи фамилию или группу..." 
             class="w-full p-2.5 rounded-lg bg-slate-800 border border-slate-700 text-sm focus:outline-none focus:border-sky-400 mb-3">
      <div id="groups-list" class="space-y-2"></div>
    </section>

    <!-- Section: Syllabus -->
    <section id="sec-syllabus" class="hidden space-y-3">
      <div id="syllabus-list" class="space-y-2"></div>
    </section>
  </main>

  <!-- JS Logic -->
  <script>
    // ⚠️ ВСТАВЬ СЮДА СВОЮ ССЫЛКУ /exec ИЗ GOOGLE APPS SCRIPT
    const API_URL = 'https://script.google.com/macros/s/AKfycbzNjMx0uo7q4nh9KPOQgk68EieQbBYTmZVvOouIM9E21ried7oDQy167Nt3tGbXDO8oKw/exec';

    let appData = { schedule: [], groups: [], syllabus: [] };

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.initDataUnsafe?.user) {
        document.getElementById('user-name').innerText = tg.initDataUnsafe.user.first_name;
      }
    }

    async function loadData() {
      try {
        const res = await fetch(`${API_URL}?action=getAll`);
        const json = await res.json();
        
        if (json.ok) {
          appData = json.data;
          renderSchedule();
          renderGroups();
          renderSyllabus();
        }
      } catch (err) {
        console.error('Ошибка загрузки данных:', err);
      } finally {
        document.getElementById('loader').classList.add('hidden');
      }
    }

    function switchTab(tab) {
      ['schedule', 'groups', 'syllabus'].forEach(t => {
        document.getElementById(`sec-${t}`).classList.add('hidden');
        document.getElementById(`tab-${t}`).className = 'py-3 px-4 border-b-2 border-transparent text-slate-400';
      });

      document.getElementById(`sec-${tab}`).classList.remove('hidden');
      document.getElementById(`tab-${tab}`).className = 'py-3 px-4 border-b-2 border-sky-400 font-semibold text-sky-400';
    }

    function renderSchedule() {
      const container = document.getElementById('sec-schedule');
      if (!appData.schedule || appData.schedule.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-4">Расписание пока пустое.</p>';
        return;
      }

      container.innerHTML = appData.schedule.map(item => `
        <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700/60 shadow-sm">
          <div class="flex justify-between items-start mb-1">
            <span class="text-xs font-bold px-2 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30">
              ${item.Subject || item.Предмет || 'Предмет'}
            </span>
            <span class="text-xs text-slate-400">${item.Date ? String(item.Date).split('T')[0] : ''}</span>
          </div>
          <p class="text-sm font-medium mt-1 text-slate-200">${item.Task || item.Задание || 'Занятие'}</p>
          <p class="text-xs text-slate-400 mt-1">📌 Тип: ${item.Type || item.Тип || 'Пара'}</p>
        </div>
      `).join('');
    }

    function renderGroups() {
      const container = document.getElementById('groups-list');
      if (!appData.groups || appData.groups.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-4">Данные по группам не найдены.</p>';
        return;
      }

      container.innerHTML = appData.groups.map(item => `
        <div class="bg-slate-800 p-3 rounded-lg border border-slate-700 text-sm flex justify-between items-center">
          <div>
            <div class="font-semibold text-slate-200">${item.Student || item.Студент || item.Subject || 'Студент'}</div>
            <div class="text-xs text-slate-400">${item.Details || item.Детали || ''}</div>
          </div>
          <span class="text-xs font-bold px-2.5 py-1 rounded-md bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
            ${item.Group || item.Группа || 'Группа 1'}
          </span>
        </div>
      `).join('');
    }

    function filterGroups() {
      const query = document.getElementById('search-group').value.toLowerCase();
      const cards = document.getElementById('groups-list').children;
      Array.from(cards).forEach(card => {
        const text = card.innerText.toLowerCase();
        card.style.display = text.includes(query) ? 'flex' : 'none';
      });
    }

    function renderSyllabus() {
      const container = document.getElementById('syllabus-list');
      if (!appData.syllabus || appData.syllabus.length === 0) {
        container.innerHTML = '<p class="text-center text-slate-500 py-4">Силлобусы пока не загружены.</p>';
        return;
      }

      container.innerHTML = appData.syllabus.map(item => `
        <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center">
          <div>
            <h4 class="font-semibold text-sm text-slate-200">${item.Subject || item.Предмет}</h4>
            <p class="text-xs text-slate-400">${item.Instructor || item.Преподаватель || 'Преподаватель'}</p>
          </div>
          <a href="${item.Link || item.Ссылка || '#'}" target="_blank" 
             class="px-3 py-1.5 bg-sky-500 text-xs font-medium rounded-lg hover:bg-sky-400 transition-colors">
            Открыть 📄
          </a>
        </div>
      `).join('');
    }

    // Загрузка при старте
    loadData();
  </script>
</body>
</html>
